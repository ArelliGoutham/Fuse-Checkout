<!DOCTYPE html>
<html lang="en" style="color-scheme: dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090A0E">
<title>Checkout — OfferForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 L4 14 L10 14 L8 22 L18 10 L12 10 Z" fill="#090A0E"/></svg>
    </div>
    <div>
      <div class="topbar-title">Checkout</div>
      <div class="topbar-store">Secure payment powered by OfferForge</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="step-pills">
      <span class="step-pill active" id="pill-review">Review</span>
      <span class="step-pill" id="pill-details">Details</span>
      <span class="step-pill" id="pill-payment">Payment</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
  </div>
</nav>

<div class="checkout-wrap">

  <!-- Step 1: Review (cart + offers + coupon) -->
  <div class="checkout-step active" id="step-review">
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-receipt card-title-icon"></i> Order Summary</div>
      <div id="cartItems"><div class="loading-state">Loading your cart…</div></div>
      <div style="margin-top:10px;">
        <div class="cart-summary-row muted"><span>Subtotal</span><span id="subtotalAmount">₹0</span></div>
        <div id="discountRows"></div>
        <div class="cart-summary-total"><span>Total</span><span id="totalAmount">₹0</span></div>
        <div id="savingsBadge"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-tag card-title-icon"></i> Coupons &amp; Offers</div>
      <div class="coupon-section">
        <div id="couponAppliedTag"></div>
        <div class="coupon-input-row" id="couponInputRow">
          <input class="coupon-input" id="couponInput" type="text" placeholder="Enter coupon code…" aria-label="Coupon code">
          <button class="coupon-btn" id="couponBtn">Apply</button>
        </div>
      </div>
      <div id="bestOfferSection"></div>
    </div>

    <button class="btn-text" style="width:100%;text-align:center;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-weight:600;color:var(--text);" onclick="showStep('details')">Continue to Details →</button>
  </div>

  <!-- Step 2: Customer Details -->
  <div class="checkout-step" id="step-details">
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-user card-title-icon"></i> Your Details</div>
      <div class="form-group"><label class="form-label" for="custName">Full Name</label><input class="form-input" id="custName" type="text" placeholder="John Doe…" autocomplete="name"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label" for="custEmail">Email</label><input class="form-input" id="custEmail" type="email" placeholder="you@example.in" autocomplete="email" spellcheck="false"></div>
        <div class="form-group"><label class="form-label" for="custPhone">Phone</label><input class="form-input" id="custPhone" type="tel" placeholder="98765 43210" autocomplete="tel" inputmode="numeric"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-location-dot card-title-icon"></i> Delivery Address</div>
      <div class="form-group"><label class="form-label" for="custLine1">Address</label><input class="form-input" id="custLine1" type="text" placeholder="House no, Street, Area…" autocomplete="address-line1"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label" for="custCity">City</label><input class="form-input" id="custCity" type="text" placeholder="Mumbai" autocomplete="address-level2"></div>
        <div class="form-group"><label class="form-label" for="custPincode">Pincode</label><input class="form-input" id="custPincode" type="text" placeholder="400001" autocomplete="postal-code" inputmode="numeric"></div>
      </div>
      <div class="form-group"><label class="form-label" for="custState">State</label><input class="form-input" id="custState" type="text" placeholder="Maharashtra" autocomplete="address-level1"></div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-text" onclick="showStep('review')">← Back</button>
      <button class="coupon-btn" id="btnContinueDetails" style="flex:1;padding:14px;font-size:15px;">Continue to Payment →</button>
    </div>
  </div>

  <!-- Step 3: Payment -->
  <div class="checkout-step" id="step-payment">
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-credit-card card-title-icon"></i> Payment Method</div>
      <div class="payment-methods" id="paymentMethods"></div>
      <div class="card-input-area" id="cardArea">
        <div class="form-group" style="margin-top:14px;">
          <label class="form-label" for="cardNumber">Card Number</label>
          <input class="form-input" id="cardNumber" type="text" placeholder="4591 30XX XXXX XXXX" inputmode="numeric" maxlength="19" autocomplete="cc-number" spellcheck="false">
        </div>
        <div id="emiSection"></div>
      </div>
    </div>
    <button class="btn-text" onclick="showStep('details')">← Back</button>
  </div>

</div>

<!-- Sticky pay bar -->
<div class="pay-bar" id="payBar" style="display:none;">
  <div>
    <div class="pay-amount-label">Amount to Pay</div>
    <div class="pay-amount" id="payAmount">₹0</div>
  </div>
  <button class="pay-btn" id="payBtn">Pay →</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>

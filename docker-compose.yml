services:
  mongodb:
    image: mongo:7
    container_name: fuse-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: fuse
      MONGO_INITDB_ROOT_PASSWORD: fuse
      MONGO_INITDB_DATABASE: fuse
    volumes:
      - fuse-mongo-data:/data/db
    restart: unless-stopped

volumes:
  fuse-mongo-data:

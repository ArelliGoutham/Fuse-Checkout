services:
  mongodb:
    image: mongo:7
    container_name: offerforge-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: offerforge
      MONGO_INITDB_ROOT_PASSWORD: offerforge
      MONGO_INITDB_DATABASE: offerforge
    volumes:
      - offerforge-mongo-data:/data/db
    restart: unless-stopped

volumes:
  offerforge-mongo-data:
